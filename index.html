<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI 大模型能力对比 · 2026.10 精密基准台</title>
  <style>
    :root {
      --bg-deep: #06080f;
      --card-bg: rgba(13, 18, 30, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(circle at 12% 0%, rgba(56, 189, 248, 0.11), transparent 38%),
        radial-gradient(circle at 88% 0%, rgba(168, 85, 247, 0.10), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.06), transparent 45%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    }
    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
    .font-mono-num {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.07);
    }
    .glass-empty {
      background: rgba(11, 15, 25, 0.45);
      border: 1.5px dashed rgba(255, 255, 255, 0.13);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-empty:hover {
      border-color: rgba(56, 189, 248, 0.48);
      background: rgba(15, 23, 42, 0.68);
    }
    @keyframes rowSlideIn {
      0% { opacity: 0; transform: translateY(6px); filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .anim-row-1 { animation: rowSlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) 0.02s both; }
    .anim-row-2 { animation: rowSlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both; }
    .anim-row-3 { animation: rowSlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both; }
    .anim-row-4 { animation: rowSlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) 0.11s both; }
    .anim-row-5 { animation: rowSlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) 0.14s both; }

    .bar-fill {
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 9999px; }

    .lead-pill {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.22), rgba(234, 88, 12, 0.15));
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fde68a;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.18);
    }

    /* 分档吸附滑块样式（28-30px 大圆点、10-12px 粗轨道、>=44px 触控区、支持键盘方向键与拖动气泡） */
    .effort-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 44px;
      min-height: 44px;
      background: transparent;
      outline: none;
      margin: 0;
      padding: 0;
      cursor: pointer;
      position: relative;
      z-index: 20;
      touch-action: pan-x;
    }
    .effort-range:disabled {
      cursor: not-allowed;
    }
    .effort-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f1f5f9 70%, #cbd5e1 100%);
      border: 3.5px solid var(--thumb-color, #38bdf8);
      box-shadow: 0 0 14px var(--thumb-glow, rgba(56, 189, 248, 0.8)), 0 3px 8px rgba(0, 0, 0, 0.75);
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
    }
    @media (min-width: 640px) {
      .effort-range::-webkit-slider-thumb {
        width: 30px;
        height: 30px;
      }
    }
    .effort-range:not(:disabled):active::-webkit-slider-thumb,
    .effort-range:not(:disabled):hover::-webkit-slider-thumb,
    .effort-range:not(:disabled):focus-visible::-webkit-slider-thumb {
      transform: scale(1.1);
      box-shadow: 0 0 20px var(--thumb-glow, rgba(56, 189, 248, 1)), 0 4px 10px rgba(0, 0, 0, 0.85), 0 0 0 3px rgba(255, 255, 255, 0.22);
    }
    .effort-range:disabled::-webkit-slider-thumb {
      background: #475569;
      border-color: #64748b;
      box-shadow: none;
      width: 22px;
      height: 22px;
    }
    .effort-range::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f1f5f9 70%, #cbd5e1 100%);
      border: 3.5px solid var(--thumb-color, #38bdf8);
      box-shadow: 0 0 14px var(--thumb-glow, rgba(56, 189, 248, 0.8)), 0 3px 8px rgba(0, 0, 0, 0.75);
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
    }
    @media (min-width: 640px) {
      .effort-range::-moz-range-thumb {
        width: 30px;
        height: 30px;
      }
    }
    .effort-range:not(:disabled):active::-moz-range-thumb,
    .effort-range:not(:disabled):hover::-moz-range-thumb,
    .effort-range:not(:disabled):focus-visible::-moz-range-thumb {
      transform: scale(1.1);
      box-shadow: 0 0 20px var(--thumb-glow, rgba(56, 189, 248, 1)), 0 4px 10px rgba(0, 0, 0, 0.85), 0 0 0 3px rgba(255, 255, 255, 0.22);
    }
    .effort-range:disabled::-moz-range-thumb {
      background: #475569;
      border-color: #64748b;
      box-shadow: none;
      width: 22px;
      height: 22px;
    }
    @keyframes sheetSlideUp {
      0% { transform: translateY(100%); opacity: 0.6; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .sheet-panel {
      height: 90vh;
      height: 90dvh;
      max-height: 90vh;
      max-height: 90dvh;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      animation: sheetSlideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    /* 宽度小于 360px 的小屏（如 iPhone SE）精细适配：标题不截断、模型名可换行/缩字、档位按钮紧凑完整显示 */
    @media (max-width: 359px) {
      .ultra-narrow-card {
        padding: 6px !important;
      }
      .ultra-narrow-slider {
        padding: 4px 5px !important;
      }
      .step-btn-item {
        font-size: 10.5px !important;
        letter-spacing: -0.04em !important;
        padding-left: 1px !important;
        padding-right: 1px !important;
      }
    }
  </style>

      if (!id) return null;
      return getModelList(board).find(m => m.id === id) || null;

    function syncDefaultEfforts() {
      slots.forEach((id, idx) => {
        const m = getModelById(id);
        if (m && m.efforts) {

        } else {
          slotEffortIdx[idx] = 0;

    let bubbleTimers = [null, null, null];

    function showSliderBubble(slotIdx, autoHideMs = 0) {
      const bubble = document.getElementById(`slider-bubble-${slotIdx}`);
      if (!bubble) return;
      bubble.classList.remove('opacity-0', 'scale-90');
      bubble.classList.add('opacity-100', 'scale-100');
      if (bubbleTimers[slotIdx]) {
        clearTimeout(bubbleTimers[slotIdx]);
        bubbleTimers[slotIdx] = null;
      }
      if (autoHideMs > 0) {
        bubbleTimers[slotIdx] = setTimeout(() => {
          hideSliderBubble(slotIdx);
        }, autoHideMs);
      }
    }

    function hideSliderBubble(slotIdx) {
      const bubble = document.getElementById(`slider-bubble-${slotIdx}`);
      if (!bubble) return;
      bubble.classList.remove('opacity-100', 'scale-100');
      bubble.classList.add('opacity-0', 'scale-90');
    }

    function changeEffort(slotIndex, effortIndex, isFastInput = false) {
      const model = getModelById(slots[slotIndex]);
      if (!model || model.fixedEffort || !model.efforts || model.efforts.length <= 1) return;
      const maxIdx = model.efforts.length - 1;
      const nextIdx = Math.max(0, Math.min(maxIdx, Number(effortIndex)));
      if (isFastInput) {
        showSliderBubble(slotIndex);
      }
      if (slotEffortIdx[slotIndex] === nextIdx) return;
      slotEffortIdx[slotIndex] = nextIdx;
      const inputEl = document.getElementById(`slider-input-${slotIndex}`);
      if (inputEl && Number(inputEl.value) !== nextIdx) {
        inputEl.value = nextIdx;
      }
      if (updateSliderAndMetricsInPlace(slotIndex)) {
        return;
      }
      renderAll(true);
    }

    function jumpToEffort(slotIndex, effortIndex, e) {
      if (e) e.stopPropagation();
      const model = getModelById(slots[slotIndex]);
      if (!model || model.fixedEffort || !model.efforts || model.efforts.length <= 1) return;
      const maxIdx = model.efforts.length - 1;
      const nextIdx = Math.max(0, Math.min(maxIdx, Number(effortIndex)));
      slotEffortIdx[slotIndex] = nextIdx;
      const inputEl = document.getElementById(`slider-input-${slotIndex}`);
      if (inputEl) {
        inputEl.value = nextIdx;
        inputEl.focus({ preventScroll: true });
      }
      if (!updateSliderAndMetricsInPlace(slotIndex)) {
        renderAll(true);
      }
      showSliderBubble(slotIndex, 950);
    }

    function handleSliderKeydown(e, slotIndex) {
      const model = getModelById(slots[slotIndex]);
      if (!model || model.fixedEffort || !model.efforts || model.efforts.length <= 1) return;
      const cur = slotEffortIdx[slotIndex] ?? 0;
      const maxIdx = model.efforts.length - 1;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault();
        if (cur > 0) {
          changeEffort(slotIndex, cur - 1, false);
        }
        showSliderBubble(slotIndex, 1000);
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (cur < maxIdx) {
          changeEffort(slotIndex, cur + 1, false);
        }
        showSliderBubble(slotIndex, 1000);
      }
    }

    function clearSlot(slotIndex, e) {
      if (e) e.stopPropagation();
      if (slotIndex === 1 && slots[2]) {
        // 删除第2栏时若第3栏有模型，自动前移补位并复位右栏切换状态
        slots[1] = slots[2];
        slotEffortIdx[1] = slotEffortIdx[2];
        slots[2] = null;
        slotEffortIdx[2] = 0;
      } else {
        slots[slotIndex] = null;
      }
      mobileRightSlot = 1;
      renderAll();
    }

    function toggleMobileRightSlot(targetSlot) {
      mobileRightSlot = targetSlot;
      renderAll();
    }

    // ==================== 计算叠加评测来源偏移后的展示分数 ====================
    function getEffectiveData(model, effortIdx) {
      if (!model || model.unavailable) return null;
      const eff = model.efforts[Math.min(effortIdx, model.efforts.length - 1)] || model.efforts[0];
      const benchObj = BENCHMARK_SOURCES[currentBoard].find(b => b.id === currentBenchmarkId) || BENCHMARK_SOURCES[currentBoard][0];

      const adjustedScores = eff.scores.map((s, idx) => {
        const off = benchObj.offsets[idx] || 0;
        return Math.min(99.9, Math.max(50.0, +(s + off).toFixed(1)));
      });

      let adjustedElo = null;
      if (currentBoard === 'image' && typeof eff.elo === 'number') {
        adjustedElo = Math.round(eff.elo + (benchObj.eloOffset || 0));
      }

      return {
        effort: eff,
        scores: adjustedScores,
        elo: adjustedElo
      };
    }

    function getCompactStepLabel(rawLabel, totalSteps) {
      const lbl = (rawLabel || '').trim();
      const map = {
        'minimal': 'min',
        'low': 'low',
        'medium': 'med',
        'high': totalSteps >= 5 ? 'hi' : 'high',
        'xhigh': 'xhi',
        'max': 'max',
        'ultra': 'ult',
        'deep-think': 'deep',
        'deep-code': 'deep',
        'heavy': 'hvy',
        'none': 'none',
        'standard': 'std',
        '非思考 (Chat)': '直出',
        '思考模式 (low)': 'low',
        '思考模式 (medium)': 'med',
        '思考模式 (high)': 'high',
        '思考 (标准)': '标准',
        '思考 (深度)': '深度',
        '思考 (高预算)': '高算',
        '非思考': '直出',
        '不思考': '直出',
        '思考模式': '思考',
        'single-pass (直出)': '直出',
        'standard (自检)': 'std',
        'high (联网+代码渲染)': 'high',
        'standard (1K)': '1K',
        'high (2K 精绘)': '2K',
        'standard (2K)': '2K',
        'high (4K 精绘)': '4K',
        'max (多图融合精修)': 'max',
        'high (+prompt_extend)': 'high',
        'thinking (自回归规划)': '思考',
        'high (Thinking)': 'high',
        'high (Deep Think)': 'deep',
        'high (256K CoT)': 'high',
        'max (满血思考)': 'max'
      };
      if (map[lbl]) return map[lbl];
      const first = lbl.split(' ')[0];
      return map[first] || first;
    }

    function buildStepButtonsHTML(efforts, slotIdx, currentEffIdx, isFixed, vendorColor) {
      const total = efforts.length;
      if (!isFixed && total > 1) {
        return `
          <div class="grid gap-0.5 sm:gap-1 mt-0.5" style="grid-template-columns: repeat(${total}, minmax(0, 1fr));">
            ${efforts.map((item, idx) => {
              const compactText = getCompactStepLabel(item.label, total);
              const desktopText = item.label.split(' ')[0] === 'minimal' ? 'min'
                : item.label.split(' ')[0] === 'medium' ? 'med'
                : item.label.split(' ')[0] === 'standard' ? 'std'
                : item.label === '思考模式 (low)' ? 'low'
                : item.label === '思考模式 (medium)' ? 'med'
                : item.label === '思考模式 (high)' ? 'high'
                : item.label === '非思考 (Chat)' ? '非思考'
                : item.label.split(' ')[0].replace('思考模式', '思考');
              const isCurrent = idx === currentEffIdx;
              return `
                <button type="button"
                        onclick="jumpToEffort(${slotIdx}, ${idx}, event)"
                        title="点击切换至 ${item.label}"
                        class="step-btn-item px-0.5 sm:px-1 py-0.5 rounded-md text-[11px] sm:text-xs font-mono-num leading-tight whitespace-nowrap text-center transition-all cursor-pointer border ${isCurrent ? 'text-white font-extrabold bg-white/[0.15] border-white/35 shadow-sm' : 'text-slate-200/95 hover:text-white font-medium bg-white/[0.04] hover:bg-white/[0.10] border-white/[0.08]'}"
                        style="${isCurrent ? `border-color:${vendorColor}; box-shadow: 0 0 8px ${vendorColor}44;` : ''}">
                  <span class="sm:hidden">${compactText}</span>
                  <span class="hidden sm:inline">${desktopText}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }
      return `
        <div class="flex items-center justify-between text-[11px] sm:text-xs text-slate-300 font-mono-num leading-tight mt-0.5 px-1 py-0.5 rounded-md bg-white/[0.03] border border-white/[0.06]">
          <span>固定强度</span>
          <span class="text-white font-bold">不可调</span>
        </div>
      `;
    }

    // ==================== 构建分档吸附滑块 HTML ====================
    function buildEffortSliderHTML(model, slotIdx, currentEffIdx, vendorColor) {
      const efforts = model.efforts || [];
      const total = efforts.length;
      const eff = efforts[Math.min(currentEffIdx, total - 1)] || efforts[0];
      const isFixed = model.fixedEffort || total <= 1;
      const pct = total > 1 ? ((currentEffIdx / (total - 1)) * 100).toFixed(1) : 100;
      const bubbleLeft = isFixed ? '50%' : `calc(${pct}% + (${14 - Number(pct) * 0.28}px))`;

      // 生成刻度圆点
      let ticksHTML = '';
      if (total > 1) {
        for (let i = 0; i < total; i++) {
          const active = i <= currentEffIdx;
          const isCurrent = i === currentEffIdx;
          ticksHTML += `
            <span class="w-2 h-2 rounded-full transition-all duration-150 ${isCurrent ? 'scale-125' : ''}"
                  style="background:${active ? '#ffffff' : 'rgba(148,163,184,0.45)'}; box-shadow:${isCurrent ? `0 0 6px ${vendorColor}` : 'none'}"></span>
          `;
        }
      }

      const stepButtonsHTML = buildStepButtonsHTML(efforts, slotIdx, currentEffIdx, isFixed, vendorColor);

      return `
        <div class="ultra-narrow-slider mt-1 px-1.5 min-[360px]:px-2 py-1 rounded-xl bg-slate-950/75 border border-white/[0.08]"
             style="--thumb-color: ${vendorColor}; --thumb-glow: ${vendorColor}aa;">
          <!-- 顶部：标题 + 当前吸附档位名称 + 实测/估计标记 -->
          <div class="flex items-center justify-between gap-1">
            <span class="text-[11px] sm:text-xs text-slate-300 font-semibold shrink-0">
              ${currentBoard === 'reasoning' ? '推理强度' : '生成档位'}
            </span>
            <div class="flex items-center gap-1 min-w-0">
              <span id="slider-label-${slotIdx}" class="text-[11px] sm:text-xs font-mono-num font-extrabold truncate px-1.5 py-0.5 rounded bg-white/[0.08] text-white border border-white/15">
                ${isFixed ? '固定' : eff.label}
              </span>
              <span id="slider-est-${slotIdx}" class="text-[10px] px-1.5 py-0.5 rounded font-bold shrink-0 ${eff.est ? 'bg-amber-500/20 text-amber-300 border border-amber-400/35' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/35'}">
                ${eff.est ? '估计' : '实测'}
              </span>
            </div>
          </div>

          <!-- 中间：至少 44px 高触控区域 + 10-12px 加粗轨道 + 28-30px 大圆点 + 顶部拖动气泡 -->
          <div class="relative flex items-center h-11 min-h-[44px] select-none">

                 style="left: ${bubbleLeft}; background: ${vendorColor};">
              <span id="slider-bubble-text-${slotIdx}">${isFixed ? '固定' : eff.label}</span>

            <!-- 轨道底色 (10px-12px 粗轨道) -->

              <div id="slider-fill-${slotIdx}" class="h-full transition-all duration-150 rounded-full"
                   style="width:${isFixed ? '100' : pct}%; background:${isFixed ? 'rgba(100,116,139,0.45)' : vendorColor}"></div>
            </div>

            <!-- 刻度吸附点 -->
            ${!isFixed && total > 1 ? `<div id="slider-ticks-${slotIdx}" class="absolute inset-x-3 flex items-center justify-between pointer-events-none z-10">${ticksHTML}</div>` : ''}

            <!-- 原生 Range 控件（44px 高度、支持手指滑动、鼠标拖动与键盘左右方向键） -->
            <input id="slider-input-${slotIdx}"
                   type="range"
                   min="0"
                   max="${Math.max(1, total - 1)}"
                   step="1"
                   value="${isFixed ? 0 : currentEffIdx}"
                   ${isFixed ? 'disabled' : ''}
                   aria-label="${model.name} ${currentBoard === 'reasoning' ? '推理强度' : '生成档位'}"
                   onpointerdown="showSliderBubble(${slotIdx})"
                   onpointerup="hideSliderBubble(${slotIdx})"
                   onpointercancel="hideSliderBubble(${slotIdx})"
                   ontouchstart="showSliderBubble(${slotIdx})"
                   ontouchend="hideSliderBubble(${slotIdx})"
                   onmouseleave="hideSliderBubble(${slotIdx})"
                   onblur="hideSliderBubble(${slotIdx})"
                   onkeydown="handleSliderKeydown(event, ${slotIdx})"
                   oninput="changeEffort(${slotIdx}, this.value, true)"
                   class="effort-range absolute inset-0 w-full h-full" />
          </div>

          <!-- 底部：可点击跳档的高对比度档位按钮 (11-12px) -->

    function updateSliderAndMetricsInPlace(changedSlotIdx) {
      const model = getModelById(slots[changedSlotIdx]);
      if (!model || model.unavailable) return false;
      const vendor = VENDORS[model.vendor];
      const efforts = model.efforts || [];
      const total = efforts.length;
      const currentEffIdx = Math.min(slotEffortIdx[changedSlotIdx], Math.max(0, total - 1));
      const eff = efforts[currentEffIdx] || efforts[0];
      const isFixed = model.fixedEffort || total <= 1;
      const pct = total > 1 ? ((currentEffIdx / (total - 1)) * 100).toFixed(1) : 100;
      const bubbleLeft = isFixed ? '50%' : `calc(${pct}% + (${14 - Number(pct) * 0.28}px))`;

      const labelEl = document.getElementById(`slider-label-${changedSlotIdx}`);
      const estEl = document.getElementById(`slider-est-${changedSlotIdx}`);
      const fillEl = document.getElementById(`slider-fill-${changedSlotIdx}`);
      const ticksEl = document.getElementById(`slider-ticks-${changedSlotIdx}`);
      const stepsEl = document.getElementById(`slider-steps-${changedSlotIdx}`);
      const bubbleEl = document.getElementById(`slider-bubble-${changedSlotIdx}`);
      const bubbleTextEl = document.getElementById(`slider-bubble-text-${changedSlotIdx}`);
      if (!labelEl || !estEl || !fillEl) return false;

      labelEl.textContent = isFixed ? '固定' : eff.label;
      estEl.textContent = eff.est ? '估计' : '实测';
      estEl.className = `text-[10px] px-1.5 py-0.5 rounded font-bold shrink-0 ${eff.est ? 'bg-amber-500/20 text-amber-300 border border-amber-400/35' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/35'}`;
      fillEl.style.width = `${isFixed ? '100' : pct}%`;

      if (bubbleEl && bubbleTextEl) {
        bubbleEl.style.left = bubbleLeft;
        bubbleTextEl.textContent = isFixed ? '固定' : eff.label;
      }

      if (ticksEl && total > 1) {
        let ticksHTML = '';
        for (let i = 0; i < total; i++) {
          const active = i <= currentEffIdx;
          const isCurrent = i === currentEffIdx;
          ticksHTML += `<span class="w-2 h-2 rounded-full transition-all duration-150 ${isCurrent ? 'scale-125' : ''}" style="background:${active ? '#ffffff' : 'rgba(148,163,184,0.45)'}; box-shadow:${isCurrent ? `0 0 6px ${vendor.color}` : 'none'}"></span>`;
        }
        ticksEl.innerHTML = ticksHTML;
      }

      if (stepsEl) {
        stepsEl.innerHTML = buildStepButtonsHTML(efforts, changedSlotIdx, currentEffIdx, isFixed, vendor.color);
      }

      // 实时重算并同步所有可见卡片的指标与「★ 本组领先」徽章
      const effectiveList = slots.map((id, idx) => {
        const m = getModelById(id);
        return getEffectiveData(m, slotEffortIdx[idx]);
      });
      const isDesktop = window.innerWidth >= 1024;
      const visibleSlotIndices = isDesktop ? [0, 1, 2] : [0, mobileRightSlot];
      const metricLabels = currentBoard === 'reasoning'
        ? [
            { name: '综合智力指数', short: '综合智力', unit: '' },
            { name: '深度推理与数学', short: '推理与数学', unit: '' },
            { name: '编程与 Agent 工程', short: '编程与Agent', unit: '' },
            { name: '知识广度与多模态', short: '知识与多模态', unit: '' }
          ]
        : [
            { name: '视觉美学与真实感', short: '美学与真实感', unit: '' },
            { name: '复杂指令与多图一致性', short: '指令与一致性', unit: '' },
            { name: '文字排版渲染 (中/英)', short: '中英文字排版', unit: '' }
          ];
      const maxScores = metricLabels.map((_, mIdx) => {
        let maxVal = -1;
        visibleSlotIndices.forEach(sIdx => {
          const data = effectiveList[sIdx];
          if (data && data.scores && typeof data.scores[mIdx] === 'number') {
            if (data.scores[mIdx] > maxVal) maxVal = data.scores[mIdx];
          }
        });
        return maxVal;
      });
      let maxElo = -1;
      if (currentBoard === 'image') {
        visibleSlotIndices.forEach(sIdx => {
          const data = effectiveList[sIdx];
          if (data && typeof data.elo === 'number' && data.elo > maxElo) {
            maxElo = data.elo;
          }
        });
      }
      const activeModelCount = visibleSlotIndices.filter(sIdx => effectiveList[sIdx] !== null).length;

      [0, 1, 2].forEach(sIdx => {
        const m = getModelById(slots[sIdx]);
        const effData = effectiveList[sIdx];
        const container = document.getElementById(`slot-metrics-${sIdx}`);
        if (!m || m.unavailable || !effData || !container) return;
        const v = VENDORS[m.vendor];
        container.innerHTML = buildMetricsHTML(m, v, effData, metricLabels, maxScores, maxElo, activeModelCount, true);
      });
      return true;
    }

    function buildMetricsHTML(model, vendor, effData, metricLabels, maxScores, maxElo, activeModelCount, skipAnim) {
      const anim2 = skipAnim ? '' : 'anim-row-2';
      const anim3 = skipAnim ? '' : 'anim-row-3';
      const anim4 = skipAnim ? '' : 'anim-row-4';
      const anim5 = skipAnim ? '' : 'anim-row-5';

      return `
        ${currentBoard === 'image' ? `
          <!-- 生图榜专属首行：Arena Elo 分数 + 误差与评测票数 -->
          <div class="py-0.5 sm:py-1 ${anim2}">
            <div class="flex items-center justify-between gap-1">
              <span class="text-[10px] sm:text-xs font-medium text-slate-300 truncate">Arena 盲测 Elo</span>
              ${activeModelCount > 1 && effData.elo === maxElo ? `<span class="lead-pill px-1.5 py-0.2 rounded-full text-[9px] sm:text-[10px] font-bold tracking-wide shrink-0">★ 本组领先</span>` : ''}
            </div>
            <div class="flex items-baseline justify-between gap-1 mt-0.5">
              <div class="flex items-baseline gap-1">
                <span class="text-base sm:text-xl lg:text-2xl font-extrabold font-mono-num text-white tracking-tight">${effData.elo}</span>
                <span class="text-[10px] sm:text-[11px] font-mono-num text-slate-400">${model.ci}</span>
              </div>
              <span class="text-[9px] sm:text-[10px] font-mono-num text-slate-400 bg-white/[0.04] px-1.5 py-0.5 rounded border border-white/5">${model.votes} 票</span>

            </div>
          </div>
        ` : ''}

        ${metricLabels.map((mMeta, mIdx) => {
          const val = effData.scores[mIdx];
          const isLeader = activeModelCount > 1 && val === maxScores[mIdx];
          const animClass = [anim2, anim3, anim4, anim5][mIdx] || anim5;
          return `
            <div class="py-0.5 sm:py-1 ${animClass}">
              <div class="flex items-center justify-between gap-1">

                  <span class="hidden sm:inline">${mMeta.name}</span>

                ${isLeader ? `<span class="lead-pill px-1.5 py-0.2 rounded-full text-[9px] sm:text-[10px] font-bold tracking-wide shrink-0">★ 本组领先</span>` : ''}
              </div>
              <div class="flex items-baseline justify-between mt-0.5">
                <div class="flex items-baseline gap-0.5">
                  <span class="text-base sm:text-xl lg:text-2xl font-extrabold font-mono-num tracking-tight ${isLeader ? 'text-white' : 'text-slate-200'}">${val.toFixed(1)}</span>

                </div>

              </div>
              <div class="w-full h-1 sm:h-1.5 bg-slate-800/90 rounded-full overflow-hidden mt-0.5">
                <div class="h-full rounded-full bar-fill" style="width:${val}%; background:${vendor.barGrad}"></div>
              </div>
            </div>
          `;
        }).join('')}
      `;
    }

                <button onclick="openPicker(${slotIdx})" class="flex-1 min-w-0 px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-xl bg-white/[0.05] hover:bg-white/[0.1] border border-white/10 flex items-center justify-between gap-1 text-left transition group">

              <!-- 模型大字号名称与定位（小屏允许换行或自适应字号，不强行截断） -->

                <div class="flex flex-wrap items-baseline justify-between gap-x-1 gap-y-0.5">

    // ==================== 厂商横向标签栏滚动与提示控制 ====================
    function scrollVendorBar(delta) {
      const bar = document.getElementById('vendorFilterBar');
      if (!bar) return;
      bar.scrollBy({ left: delta, behavior: 'smooth' });
    }

    function updateVendorScrollHints() {
      const bar = document.getElementById('vendorFilterBar');
      const leftBtn = document.getElementById('vendorScrollLeftBtn');
      const rightBtn = document.getElementById('vendorScrollRightBtn');
      if (!bar || !leftBtn || !rightBtn) return;

      const maxScroll = bar.scrollWidth - bar.clientWidth;
      if (bar.scrollLeft > 10) {
        leftBtn.classList.remove('hidden');
        leftBtn.classList.add('flex');
      } else {
        leftBtn.classList.add('hidden');
        leftBtn.classList.remove('flex');
      }

      if (maxScroll - bar.scrollLeft > 10) {
        rightBtn.classList.remove('hidden');
        rightBtn.classList.add('flex');
      } else {
        rightBtn.classList.add('hidden');
        rightBtn.classList.remove('flex');
      }
    }

    // ==================== 模型选择弹窗逻辑（支持分组、筛选与模型名优先搜索） ====================
    function openPicker(slotIdx) {
      activePickerSlot = slotIdx;
      activeVendorFilter = 'ALL';
      pickerSearchQuery = '';
      const searchInput = document.getElementById('pickerSearchInput');
      if (searchInput) searchInput.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');

      const modal = document.getElementById('pickerModal');
      const title = document.getElementById('modalTitle');
      const subtitle = document.getElementById('modalSubtitle');
      title.textContent = `选择第 ${slotIdx + 1} 栏对比模型 · ${currentBoard === 'reasoning' ? '推理与通用榜' : '图片生成榜'} (${getModelList().length}款)`;
      if (subtitle) {
        subtitle.textContent = currentBoard === 'reasoning'
          ? '覆盖 9 大厂商截至 2026.10.31 全系现役旗舰、中端、轻量、推理、编程与开源模型'
          : '覆盖 9 大厂商截至 2026.10.31 全系现役文生图、多图编辑、中英海报排版与开源视觉模型';
      }
      renderPickerContent();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(updateVendorScrollHints, 30);
    }

    function closePicker() {
      const modal = document.getElementById('pickerModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function setVendorFilter(vKey) {
      activeVendorFilter = vKey;
      renderPickerContent();
    }

    function handlePickerSearch(val) {
      pickerSearchQuery = (val || '').trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (pickerSearchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderPickerContent();
    }

    function clearPickerSearch() {
      pickerSearchQuery = '';
      const searchInput = document.getElementById('pickerSearchInput');
      if (searchInput) searchInput.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderPickerContent();
    }

    function selectModelForSlot(modelId) {
      slots[activePickerSlot] = modelId;
      const m = getModelById(modelId);
      if (m && m.efforts) {
        slotEffortIdx[activePickerSlot] = m.defaultEffortIndex ?? 0;
      }
      if (activePickerSlot === 2) {
        mobileRightSlot = 2;
      }
      closePicker();
      renderAll();
    }

    // 计算搜索匹配优先级得分：模型名称命中 > 厂商/定位命中 > 简介命中
    function getSearchMatchPriority(m, query) {
      if (!query) return 1;
      const v = VENDORS[m.vendor];
      const nameLower = m.name.toLowerCase();
      const idLower = m.id.toLowerCase();
      const tierLower = (m.tier || '').toLowerCase();
      const statusLower = (m.status || '').toLowerCase();
      const vendorLower = `${v.name} ${v.sub} ${m.vendor}`.toLowerCase();
      const highlightLower = (m.highlight || '').toLowerCase();

      if (nameLower === query || idLower === query) return 120;
      if (nameLower.startsWith(query)) return 110;
      const nameTokens = nameLower.split(/[\s\-()/]+/);
      if (nameTokens.some(tok => tok.startsWith(query))) return 100;
      if (nameLower.includes(query) || idLower.includes(query)) return 85;
      if (vendorLower.includes(query)) return 60;
      if (tierLower.includes(query) || statusLower.includes(query)) return 45;
      if (highlightLower.includes(query) || (m.release || '').toLowerCase().includes(query)) return 15;
      return 0;
    }

    function renderPickerContent() {
      const filterBar = document.getElementById('vendorFilterBar');
      const listEl = document.getElementById('pickerList');
      const allModels = getModelList();

      const vendorKeys = ['ALL', 'Google', 'OpenAI', 'Anthropic', 'xAI', 'DeepSeek', 'Qwen', 'Kimi', 'ByteDance', 'Meta'];
      filterBar.innerHTML = vendorKeys.map(vk => {
        const isActive = activeVendorFilter === vk;
        const count = vk === 'ALL' ? allModels.length : allModels.filter(m => m.vendor === vk).length;
        const label = vk === 'ALL' ? `全部 (${count})` : `${VENDORS[vk].name} (${count})`;
        return `
          <button type="button" onclick="setVendorFilter('${vk}')" class="shrink-0 px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${isActive ? 'bg-sky-500 text-slate-950 shadow-sm' : 'bg-white/[0.06] text-slate-200 hover:bg-white/[0.12]'}">
            ${label}
          </button>
        `;
      }).join('');
      setTimeout(updateVendorScrollHints, 10);

      let baseList = activeVendorFilter === 'ALL'
        ? allModels
        : allModels.filter(m => m.vendor === activeVendorFilter);

      let scored = baseList.map((m, idx) => ({
        model: m,
        origIdx: idx,
        matchScore: getSearchMatchPriority(m, pickerSearchQuery)
      })).filter(item => item.matchScore > 0);

      if (scored.length === 0) {
        listEl.innerHTML = `
          <div class="py-12 text-center text-slate-400 text-xs">
            未找到匹配的模型，请尝试其他关键词或切换厂商标签
          </div>
        `;
        return;
      }

      const renderModelRow = (m, matchScore) => {
        const v = VENDORS[m.vendor];
        const isSelected = slots[activePickerSlot] === m.id;
        const eff = m.efforts ? m.efforts[m.defaultEffortIndex ?? 0] : null;
        const previewScore = m.unavailable
          ? '暂无'
          : currentBoard === 'image'
          ? `${eff.elo} Elo`
          : `${eff.scores[0].toFixed(1)} 分`;

        const statusBadge = m.status === '已退役'
          ? 'bg-rose-500/15 text-rose-300 border-rose-500/30'
          : m.status === '初步成绩'
          ? 'bg-amber-500/15 text-amber-300 border-amber-500/30'
          : m.status === '开源'
          ? 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30'
          : 'bg-white/[0.06] text-slate-300 border-white/10';

        const isNameHit = pickerSearchQuery && matchScore >= 85;

        return `
          <div onclick="selectModelForSlot('${m.id}')" class="px-3 py-2 rounded-xl border transition cursor-pointer flex items-center justify-between gap-2.5 ${isSelected ? 'bg-sky-500/15 border-sky-400/50' : isNameHit ? 'bg-sky-500/[0.07] hover:bg-sky-500/[0.12] border-sky-400/30' : 'bg-white/[0.03] hover:bg-white/[0.08] border-white/10'}">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="inline-flex items-center gap-1 px-1.5 py-0.2 rounded text-[10px] font-semibold" style="background:${v.badgeBg}; color:${v.color}; border:1px solid ${v.badgeBorder}">
                  ${v.name}
                </span>
                <span class="text-xs sm:text-sm font-bold text-white truncate">${m.name}</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded border ${statusBadge}">${m.status}</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded bg-white/[0.04] text-slate-300">${m.tier}</span>
                <span class="text-[10px] text-slate-500 font-mono-num">${m.release}</span>
              </div>
              <p class="text-[11px] text-slate-400 truncate mt-0.5">${m.highlight}</p>
            </div>
            <div class="text-right shrink-0">
              <div class="text-xs sm:text-sm font-extrabold font-mono-num" style="color:${m.unavailable ? '#64748b' : v.color}">${previewScore}</div>
              <div class="text-[10px] text-slate-400">${m.unavailable ? '不支持' : (m.fixedEffort ? '固定强度' : `${m.efforts.length}档可调`)}</div>
            </div>
          </div>
        `;
      };

      // 搜索时严格按模型名称匹配优先级排序（如搜 opus 优先展示 Claude Opus 系列）
      if (pickerSearchQuery) {
        scored.sort((a, b) => {
          if (b.matchScore !== a.matchScore) return b.matchScore - a.matchScore;
          return a.origIdx - b.origIdx;
        });
        listEl.innerHTML = `
          <div class="text-[11px] text-sky-300 font-medium px-1 pb-1 flex items-center justify-between">
            <span>已按「模型名称优先」排序匹配结果 (${scored.length} 款)</span>
            <span class="text-slate-500 text-[10px]">名称命中排在最前</span>
          </div>
          <div class="space-y-1.5">
            ${scored.map(item => renderModelRow(item.model, item.matchScore)).join('')}
          </div>
        `;
        return;
      }

      // 未搜索时按厂商分组显示标题
      const grouped = {};
      scored.forEach(({ model, matchScore }) => {
        if (!grouped[model.vendor]) grouped[model.vendor] = [];
        grouped[model.vendor].push({ model, matchScore });
      });

      listEl.innerHTML = Object.keys(grouped).map(vKey => {
        const v = VENDORS[vKey];
        const groupModels = grouped[vKey];
        return `
          <div class="space-y-1">
            <div class="sticky top-0 z-10 bg-[#0b101d]/95 backdrop-blur py-1 px-1 flex items-center justify-between border-b border-white/5">
              <div class="flex items-center gap-1.5 text-xs font-bold" style="color:${v.color}">
                ${v.svg}
                <span>${v.name} (${v.sub})</span>
              </div>
              <span class="text-[10px] text-slate-500 font-mono-num">${groupModels.length} 款模型</span>
            </div>
            ${groupModels.map(item => renderModelRow(item.model, item.matchScore)).join('')}
          </div>
        `;
      }).join('');
    }

    // 厂商标签栏支持鼠标滚轮横向滚动
    document.getElementById('vendorFilterBar').addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        e.currentTarget.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // 点击背景关闭弹窗
    document.getElementById('pickerModal').addEventListener('click', (e) => {
      if (e.target.id === 'pickerModal') closePicker();
    });

    window.addEventListener('resize', () => {
      renderAll(true);
      updateVendorScrollHints();
    });

    // 初始化启动
    syncDefaultEfforts();
    updateHeaderUI();
    renderAll();
  </script>
</body>
</html>
